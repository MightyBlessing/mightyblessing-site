name: Deploy to Lightsail

on:
  push:
    branches: [main]

concurrency:
  group: lightsail-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write PEM key
        env:
          LIGHTSAIL_PEM: ${{ secrets.LIGHTSAIL_PEM }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$LIGHTSAIL_PEM" > ~/.ssh/lightsail-mbweb.pem
          chmod 400 ~/.ssh/lightsail-mbweb.pem

      - name: Redeploy
        run: ./scripts/lightsail/redeploy-mb-site.sh ~/.ssh/lightsail-mbweb.pem
